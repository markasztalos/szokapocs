<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szókapocs - Játék Beállítása</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.7">
</head>

<body>
    <header class="app-header">
        <!-- Bal: logo + visszaszámláló gomb -->
        <div class="header-left">
            <div class="logo">
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                </svg>
                <span>Szókapocs</span>
            </div>
            <button id="highlight-countdown-btn" class="highlight-countdown-btn" hidden>5</button>
        </div>

        <!-- Jobb: gombok + timer -->
        <div class="header-right">
            <button id="retry-btn" class="icon-btn" title="Mutasd újra" disabled>
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
            <button id="pass-btn" class="icon-btn" title="Pasz" disabled>
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
            <button id="draw-btn" class="icon-btn" title="Sorsolás" disabled>
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2v6h-6" />
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                    <path d="M3 22v-6h6" />
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                </svg>
            </button>
            <div id="game-timer" class="timer-display" hidden>
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                <span id="timer-text">00:00</span>
            </div>
            <button id="resize-btn" class="icon-btn" title="Újraméretezés" hidden>
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
            <button id="exit-btn" class="icon-btn" title="Kilépés" hidden>
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
        </div>
    </header>

    <main class="setup-container" id="setup-view">
        <div class="content-box">
            <div class="box-header">
                <div class="section-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6" />
                        <line x1="8" y1="12" x2="21" y2="12" />
                        <line x1="8" y1="18" x2="21" y2="18" />
                        <line x1="3" y1="6" x2="3.01" y2="6" />
                        <line x1="3" y1="12" x2="3.01" y2="12" />
                        <line x1="3" y1="18" x2="3.01" y2="18" />
                    </svg>
                    <span>Szókészlet</span>
                </div>
                <button id="regenerate-btn" class="secondary-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2v6h-6" />
                        <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                        <path d="M3 22v-6h6" />
                        <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                    </svg>
                    Újragenerálás
                </button>
            </div>

            <div class="word-list" id="word-inputs">
                <!-- Inputs will be generated by JS -->
            </div>
        </div>

        <div class="actions">
            <button id="start-game-btn" class="primary-btn">
                Játék Indítása
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
        </div>
    </main>

    <main class="game-container" id="game-view" hidden>
        <div class="game-grid-wrapper">
            <div id="main-grid" class="game-grid">
                <!-- Grid items will be generated by JS -->
            </div>
        </div>
    </main>

    <!-- Kilépés megerősítése -->
    <div id="exit-overlay" class="modal-overlay" hidden>
        <div class="modal-card">
            <h2 class="modal-title">Biztosan ki akarsz lépni?</h2>
            <div class="modal-buttons">
                <button id="exit-cancel-btn" class="modal-btn-secondary">Mégsem</button>
                <button id="exit-confirm-btn" class="modal-btn-primary modal-btn-danger">Igen, kilépek</button>
            </div>
        </div>
    </div>

    <!-- Rossz tipp popup -->
    <div id="wrong-guess-overlay" class="modal-overlay" hidden>
        <div class="modal-card">
            <h2 class="modal-title">Nem talált!</h2>
            <p class="modal-description">Ha akarod, megadhatod, hogy mi volt mondott a szó. A játék végén, vagy amikor
                kilépsz, megnézheted, hogy mik lettek volna a helyes válaszok.</p>
            <input type="text" id="wrong-guess-input" class="modal-input" placeholder="Írd be a szót...">
            <div class="modal-buttons">
                <button id="wrong-guess-skip-btn" class="modal-btn-secondary">Kihagyom</button>
                <button id="wrong-guess-save-btn" class="modal-btn-primary" disabled>Megjegyez</button>
            </div>
        </div>
    </div>

    <!-- Játék vége összesítő popup -->
    <div id="results-overlay" class="modal-overlay" hidden>
        <div class="modal-card">
            <h2 class="modal-title">Hibás tippek</h2>
            <div id="results-list" class="results-list"></div>
            <div class="modal-buttons">
                <button id="results-close-btn" class="modal-btn-primary">Bezárás</button>
            </div>
        </div>
    </div>

    <script src="words.js"></script>
    <script src="main.js?v=6"></script>
</body>

</html>
